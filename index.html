<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FAF9F5"/>
  <meta name="color-scheme" content="light"/>
  <meta name="description" content="MedMind · 把临床案例生成可交互的 3D 问题图谱：五套思维模板、神经元案例图谱、2D 卡片画布。纯静态站点，填写自己的 API Key 即可使用。"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <title>MedMind · 临床案例问题图谱</title>
  <style>
    .boot-loader{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#FAF9F5;color:#5F5B52;font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}
    .boot-mark{width:42px;height:42px;border-radius:14px;background:#F8EBE4;border:1px solid #E7CBBE;display:grid;place-items:center;color:#C15F3C;font-size:20px}
    .boot-loader p{margin:0;letter-spacing:.04em}
    .boot-loader small{color:#8C877C;font-size:11px}
  </style>
</head>
<body>
  <div id="root"><div class="boot-loader"><span class="boot-mark">✦</span><p>MedMind · 正在载入图谱空间…</p><small>首次加载稍慢，请稍候</small></div></div>
  <noscript><div style="padding:40px;text-align:center;font:14px sans-serif;color:#2C2A26">MedMind 需要启用 JavaScript 才能显示 3D 图谱，请在浏览器设置中开启后刷新。</div></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
